services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: college_db
      POSTGRES_USER: college_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - college_db_data:/var/lib/postgresql/data

volumes:
  college_db_data:
